[package]
name = "kikki-pdf"
version = "0.18.0"
description = "Local desktop PDF editor"
authors = ["Kikki PDF contributors"]
edition = "2021"

[lib]
name = "kikki_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
lopdf = "0.45"
rand = "0.9"
zeroize = "1"
